<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual magnetic reconnection thruster</title>
  <desc id="desc">An asymmetric magnetic field is driven into a reconnection layer, ejecting a plasmoid as directed exhaust and producing net thrust.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="1" stop-color="#eef5f6"/>
    </linearGradient>
    <linearGradient id="plasma" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2774ae" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#19a6a2" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffd100" stop-opacity=".8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2774ae"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d69f00"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>

  <path d="M86 154 H1044 M86 566 H1044" fill="none" stroke="#003b5c" stroke-width="8" stroke-linecap="round"/>
  <path d="M1044 154 Q1125 360 1044 566" fill="none" stroke="#003b5c" stroke-width="8"/>
  <path d="M86 154 Q42 360 86 566" fill="none" stroke="#003b5c" stroke-width="8"/>

  <g fill="none" stroke="#2774ae" stroke-width="14" opacity=".95">
    <rect x="126" y="210" width="38" height="102" rx="12"/>
    <rect x="126" y="408" width="38" height="102" rx="12"/>
    <rect x="222" y="160" width="38" height="96" rx="12"/>
    <rect x="222" y="464" width="38" height="96" rx="12"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M166 261 C310 256 370 302 526 351 C368 404 300 468 164 459" stroke="#2774ae" stroke-width="7"/>
    <path d="M260 207 C372 222 430 286 526 351 C420 425 360 488 260 513" stroke="#2774ae" stroke-width="7"/>
    <path d="M166 459 C306 467 388 420 526 369 C381 312 300 257 164 261" stroke="#19a6a2" stroke-width="5" opacity=".9"/>
    <path d="M260 513 C378 485 440 426 526 369 C426 294 372 229 260 207" stroke="#19a6a2" stroke-width="5" opacity=".9"/>
  </g>

  <ellipse cx="565" cy="360" rx="72" ry="54" fill="#ffd100" opacity=".24" filter="url(#glow)"/>
  <path d="M526 314 L604 406 M526 406 L604 314" stroke="#d69f00" stroke-width="12" stroke-linecap="round"/>

  <path d="M616 360 C688 289 800 274 900 318 C957 343 957 377 900 402 C800 446 688 431 616 360 Z" fill="url(#plasma)"/>
  <g fill="none" stroke-linecap="round">
    <ellipse cx="784" cy="360" rx="132" ry="92" stroke="#2774ae" stroke-width="7"/>
    <ellipse cx="784" cy="360" rx="98" ry="66" stroke="#19a6a2" stroke-width="6"/>
    <ellipse cx="784" cy="360" rx="63" ry="41" stroke="#d69f00" stroke-width="5"/>
  </g>

  <path d="M618 360 H1012" fill="none" stroke="#2774ae" stroke-width="10" marker-end="url(#arrow-blue)"/>
  <path d="M1032 634 H842" fill="none" stroke="#d69f00" stroke-width="10" marker-end="url(#arrow-gold)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="110" y="102" fill="#003b5c" font-size="28" font-weight="700" letter-spacing="2">ASYMMETRIC FIELD + CURRENT DRIVE</text>
    <text x="565" y="252" fill="#8d6900" font-size="25" font-weight="700" text-anchor="middle">RECONNECTION</text>
    <text x="810" y="254" fill="#003b5c" font-size="25" font-weight="700" text-anchor="middle">PLASMOID</text>
    <text x="822" y="334" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">ALFVÉNIC EXHAUST</text>
    <text x="940" y="680" fill="#8d6900" font-size="25" font-weight="700" text-anchor="middle">NET THRUST</text>
  </g>
</svg>
